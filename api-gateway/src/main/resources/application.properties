spring.application.name=api-gateway
server.port=9090

spring.cloud.gateway.server.webflux.routes[0].id=inventory-microservice
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webflux.routes[1].id=order-microservice
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/orders/**

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/orders-inventory-realm
